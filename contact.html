
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        nav {
            text-align: center;
            margin-bottom: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-weight: bold;
        }

        .card {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #5b4baf;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            margin-top: 18px;
            padding: 12px 20px;
            background: #6655c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            color: #287a38;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="about.html">Giới thiệu</a>
        <a href="contact.html">Liên hệ</a>
    </nav>

    <div class="card">
        <h1>Liên hệ</h1>

        <form id="contactForm">
            <label for="name">Họ và tên</label>
            <input type="text" id="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="message">Nội dung</label>
            <textarea id="message" rows="4" required></textarea>

            <button type="submit">Gửi thông tin</button>
        </form>

        <p id="result"></p>
    </div>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("result").textContent =
                "Biểu mẫu hoạt động! Đây chỉ là bản thử nghiệm, chưa gửi dữ liệu đi đâu.";
            this.reset();
        });
    </script>
</body>
</html>
